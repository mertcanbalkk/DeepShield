name: Code quality and security smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate syntax and release files
        run: python -m compileall -q app.py model_adapters.py training upload_safety.py && python scripts/check_release.py
      - name: Run tests (optional torch tests skipped without torch)
        run: python -m pytest -q tests
